<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色同步测试（模拟 API）</title><link rel="stylesheet" href="../style.css">
<style>body{margin:0;background:#182a40;color:#eee;font-family:system-ui}#st-chatu8-settings{position:relative;height:100dvh;--st-chatu8-bg-primary:#182a40;--st-chatu8-text-primary:#eee;--st-chatu8-border-radius:12px}main{padding:20px}button{padding:10px}pre{white-space:pre-wrap}</style>
<div id="st-chatu8-settings"><main><h2>角色同步测试（模拟 API）</h2><p>仅模拟角色卡、世界书和正文，不读取真实设置，不调用付费 API。</p><button id="character_sync">同步 · 按当前角色卡</button><label><input type="checkbox" id="character_sync_auto">聊天回复后自动检测角色</label><button id="reply">模拟新回复</button><button id="switch">模拟切换聊天</button><button id="pending">模拟慢请求</button><pre id="report">待测试</pre></main></div>
<script type="module">
import { initializeCharacterSync, bindCharacterSyncControls } from '../character-sync.js';
const report = document.getElementById('report');
const settings = { characterPresetId: '已有角色', characterPresets: { '已有角色': { nameCN: '爱丽丝|小爱', facialFeatures: 'manual blue eyes', outfits: ['水手服'], photoImageIds: ['photo-test'] } }, current_llm_profile: '模拟 API', llm_profiles: { '模拟 API': { api_url: 'https://example.test/v1', api_key: 'test', model: 'text-test' } } };
const ctx = { characterId: 0, chatId: 'chat-a', characters: [{ avatar: 'Alice.png', data: { name: '爱丽丝', description: '爱丽丝有蓝眼睛。', extensions: { world: '人物书' } } }], chat: [{ name: '爱丽丝', mes: '爱丽丝遇见查理。查理天生绿眼睛。他穿着红外套。' }], loadWorldInfo: async () => ({ entries: { one: { comment: '爱丽丝 · 外貌', key: ['爱丽丝'], content: '爱丽丝有红眼睛。' }, two: { comment: '莉莉', key: ['莉莉'], content: '莉莉是金发女士。' }, huge: { comment: '无关历史（超长条目）', content: '历史资料。'.repeat(30000) } } }) };
const field = (value, evidence) => ({ value, evidence });
const result = { card: [{ name: '爱丽丝', evidence: '爱丽丝有蓝眼睛。', fields: { facialFeatures: field('blue eyes', '蓝眼睛') } }], world: [{ name: '爱丽丝', evidence: '爱丽丝有红眼睛。', fields: { facialFeatures: field('red eyes', '红眼睛') } }, { name: '莉莉', evidence: '莉莉是金发女士。', fields: { facialFeatures: field('blonde hair', '金发女士') } }], chat: [{ name: '查理', evidence: '查理天生绿眼睛。', fields: { facialFeatures: field('green eyes', '天生绿眼睛') } }] };
const callbacks = new Map(); let slow = false, requests = 0;
initializeCharacterSync({ getSettings: () => settings, getContext: () => ctx, getWorldInfo: () => ({}), events: { on(name, callback) { callbacks.set(name, callback); } }, eventTypes: { GENERATION_ENDED: 'ended', CHAT_CHANGED: 'changed' }, save() {}, refresh() { report.textContent = JSON.stringify({ settings, requests }, null, 2); }, notify(message) { report.textContent += '\n' + message; }, network: { getHeaders: () => ({}), parseHeaders: () => ({}), parseBody: () => ({}), includeHeaders: () => '', fetchImpl: async (url, options) => { if (url.endsWith('/status')) return { ok: true, status: 200, json: async () => ({ data: [{ id: 'text-test' }, { id: 'text-alternative' }] }) }; requests++; if (slow) return new Promise((_, reject) => options.signal.addEventListener('abort', () => { report.textContent = '请求已中止，未保存。'; reject(new DOMException('Aborted', 'AbortError')); }, { once: true })); return { ok: true, status: 200, json: async () => ({ choices: [{ message: { content: JSON.stringify(result) } }] }) }; } } });
bindCharacterSyncControls();
document.getElementById('reply').onclick = () => { slow = false; ctx.chat.push({ name: '爱丽丝', mes: `爱丽丝又遇见查理。查理天生绿眼睛。第 ${ctx.chat.length} 次。` }); callbacks.get('ended')(); };
document.getElementById('switch').onclick = () => { ctx.chatId = 'chat-b'; callbacks.get('changed')(); report.textContent = '已切换聊天，同步窗口关闭，旧请求不能保存。'; };
document.getElementById('pending').onclick = () => { slow = true; document.getElementById('character_sync').click(); };
</script></html>
