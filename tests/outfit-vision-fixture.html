<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>服装反推界面测试（模拟 API）</title><link rel="stylesheet" href="../style.css">
<style>body{margin:0;background:#182a40;color:#fff;font-family:system-ui}#st-chatu8-settings{position:relative;height:100dvh;--st-chatu8-bg-primary:#182a40;--st-chatu8-text-primary:#eee;--st-chatu8-border-radius:12px}main{padding:20px}button{padding:10px}</style>
<div id="st-chatu8-settings"><main><h2>服装反推界面测试（模拟 API）</h2><p>仅使用测试服装和模拟模型，不调用外部服务，不修改酒馆设置。</p>
<button id="open">打开反推窗口</button><button id="pending">测试取消请求</button><button id="stale">测试旧结果保护</button><pre id="report">待测试</pre></main></div>
<script type="module">
import { openOutfitVision } from '../outfit-vision.js';
const preset = {nameCN:'原名称',upperBody:'old top',upperBodyBack:'old back',fullBody:'old bottom',photoImageIds:['image-test'],selectedPhotoIndex:0};
const settings={outfitPresetId:'测试服装',outfitPresets:{'测试服装':preset},current_llm_profile:'测试 API',llm_profiles:{'测试 API':{api_url:'https://example.test/v1',api_key:'test-key',model:'vision-test',send_images:false}}};
const report=document.getElementById('report');let mode='normal',aborted=false,recognitionRequests=0;
const result={nameCN:'黑色水手服',nameEN:'black sailor uniform',upperBody:'black sailor collar top, white necktie',fullBody:'black pleated skirt, dark tights, brown loafers',upperBodyBack:null,fullBodyBack:null,photoPrompt:'black sailor collar top, white necktie, black pleated skirt, dark tights, brown loafers',notes:'模拟识别：背面不可见，材质无法确定。'};
const deps={getSettings:()=>settings,getImage:async()=> 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aM1sAAAAASUVORK5CYII=',
save(){},refresh(){report.textContent=JSON.stringify({preset,recognitionRequests},null,2);},notify(message){report.textContent+='\n'+message;},network:{getHeaders:()=>({}),parseHeaders:()=>({}),parseBody:()=>({}),includeHeaders:()=>'',
fetchImpl:async(url,options)=>{
 if(url.endsWith('/status'))return{ok:true,status:200,json:async()=>({data:[{id:'vision-test'},{id:'vision-alternative'}]})};
 recognitionRequests++;
 if(mode==='pending')return new Promise((_,reject)=>options.signal.addEventListener('abort',()=>{aborted=true;report.textContent='取消请求验证通过：AbortSignal 已中止，未保存服装。';reject(new DOMException('Aborted','AbortError'));},{once:true}));
 if(mode==='stale')settings.outfitPresetId='其他服装';
 return{ok:true,status:200,json:async()=>({choices:[{message:{content:JSON.stringify(result)}}]})};
}}};
document.getElementById('open').onclick=()=>{mode='normal';settings.outfitPresetId='测试服装';openOutfitVision(deps);};
document.getElementById('pending').onclick=()=>{mode='pending';settings.outfitPresetId='测试服装';openOutfitVision(deps);};
document.getElementById('stale').onclick=()=>{mode='stale';settings.outfitPresetId='测试服装';openOutfitVision(deps);};
</script></html>
