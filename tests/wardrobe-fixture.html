<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色衣橱交互测试</title><link rel="stylesheet" href="../style.css"><style>body{margin:20px;background:#0c192a;color:#eee;font-family:sans-serif}button{cursor:pointer}#fixture-controls{display:flex;gap:10px;margin:12px}#fixture-status{white-space:pre-wrap}</style><div id="fixture-controls"><button id="reply">正文换装</button><button id="swipe">切换候选回复</button><button id="switch">切换聊天</button><button id="generate">模拟首次生成</button></div><div id="fixture-status"></div><div id="wardrobe-root"></div><script type="module">
import {initializeWardrobe,mountWardrobe} from '../wardrobe-ui.js';
import {library} from '../wardrobe-store.js';
const s={llm_profiles:{测试:{api_url:'https://wardrobe.test/v1',api_key:'fixture-only',model:'text-test',bypass_proxy:true}},characterPresets:{Alice:{nameCN:'爱丽丝|小爱',nameEN:'Alice',characterTraits:'black hair',outfits:['水手服','连衣裙']},Lily:{nameCN:'莉莉',nameEN:'Lily',outfits:['水手服']}},outfitPresets:{水手服:{nameCN:'水手服|校服',upperBody:'navy sailor shirt',fullBody:'pleated skirt'},连衣裙:{nameCN:'连衣裙',upperBody:'black dress'}},characterCommonPresetId:'通用',characterCommonPresets:{通用:{characters:['Alice','Lily']}}};const ctx={chatId:'chat-a',characterId:0,chat:[{is_user:false,mes:'爱丽丝穿着水手服。莉莉坐在旁边。',swipe_id:0}]};const listeners={},events={on:(e,f)=>(listeners[e]||=[]).push(f)},emit=async(e,data)=>{for(const f of listeners[e]||[])await f(data)};let images={},num=0;
if(new URLSearchParams(location.search).has('many'))for(let i=1;i<=37;i++)s.outfitPresets['测试服装'+i]={nameCN:'测试服装'+i,upperBody:'blue shirt'};
if(new URLSearchParams(location.search).has('empty'))s.characterPresets={};
if(new URLSearchParams(location.search).has('configured')){const w=library(s),role=Object.values(w.roles).find(r=>r.key==='Alice');role.defaultComboId=Object.values(w.combinations).find(c=>c.name==='水手服').id;}
if(new URLSearchParams(location.search).has('phone')){document.getElementById('fixture-controls').hidden=true;document.getElementById('fixture-status').hidden=true;document.getElementById('fixture-controls').style.display='none';}
const status=()=>document.getElementById('fixture-status').textContent=JSON.stringify({chat:ctx.chatId,source:ctx.chat.at(-1).mes,scene:s.wardrobe?.scenes,covers:s.wardrobe?.covers,pending:s.wardrobe?.pending.length},null,2);
const originalFetch=window.fetch.bind(window);window.fetch=async(url,opts)=>{if(String(url).startsWith('https://wardrobe.test')){if(String(url).endsWith('/models'))return Response.json({data:[{id:'text-test'},{id:'vision-test'}]});const body=JSON.parse(opts.body);if(Array.isArray(body.messages?.at(-1)?.content))return Response.json({choices:[{message:{content:JSON.stringify({nameCN:'测试图片外套',nameEN:'image jacket',upperBody:'blue jacket',fullBody:'black pants',upperBodyBack:null,fullBodyBack:null,photoPrompt:'blue jacket, black pants',notes:'测试识图结果，无外部 API 请求'})}}]});const user=JSON.parse(body.messages.at(-1).content);return Response.json({choices:[{message:{content:JSON.stringify([{id:user.inventory?.find(x=>x.name==='水手服')?.id,evidence:'爱丽丝穿着水手服',reason:'正文明确提及角色和套装'}])}}]});}return originalFetch(url,opts);};
initializeWardrobe({getSettings:()=>s,getContext:()=>ctx,events,eventTypes:{GENERATION_ENDED:'reply',CHAT_CHANGED:'change',MESSAGE_SWIPED:'swipe'},save:status,refresh:()=>{},notify:(m)=>{document.getElementById('fixture-status').textContent=m},getImage:async id=>images[id],saveImage:async data=>{const id='image-'+(++num);images[id]=data;return id},legacy:()=>{},network:{parseHeaders:()=>({}),parseBody:()=>({}),getHeaders:()=>({}),includeHeaders:()=>[]}});mountWardrobe();
document.getElementById('reply').onclick=()=>{ctx.chat.push({is_user:false,mes:'爱丽丝穿着连衣裙，坐在窗边。'});emit('reply');status();};document.getElementById('swipe').onclick=()=>{ctx.chat[0].swipe_id++;emit('swipe');status();};document.getElementById('switch').onclick=()=>{ctx.chatId=ctx.chatId==='chat-a'?'chat-b':'chat-a';emit('change');status();};document.getElementById('generate').onclick=async()=>{const id='job-'+num;await emit('generate-image-request',{id,prompt:'Alice portrait'});await emit('generate-image-response',{id,success:true,imageData:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a/3cAAAAASUVORK5CYII='});status();};
</script>
