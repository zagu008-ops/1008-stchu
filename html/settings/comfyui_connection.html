<div id="ch-tab-comfyui-connection">
    <section class="st-chatu8-settings-section" id="ch-comfyui-connection">
        <h3>ComfyUI 连接设置</h3>
        <div class="st-chatu8-field">
            <label for="comfyuiUrl">API 地址</label>
            <div class="st-chatu8-input-group">
                <i class="fa-solid fa-exclamation-triangle st-chatu8-url-warning-icon" title="无效的URL格式"></i>
                <input type="text" id="comfyuiUrl" class="st-chatu8-text-input" placeholder="http://127.0.0.1:8188">
                <button id="testComfyui" class="st-chatu8-btn">连接刷新数据</button>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <button id="ch-comfyui-test-image" class="st-chatu8-btn">生成一张测试图</button>
            <small>使用当前工作流生成 512×512 的猫咪插画，检查完整生图连接。无需调用 LLM。</small>
            <div id="ch-comfyui-test-result" role="status"></div>
        </div>
        <div class="st-chatu8-field">
            <label for="comfyui_max_concurrency">并发请求上限 (最大10并发)</label>
            <input type="number" id="comfyui_max_concurrency" class="st-chatu8-text-input" min="1" max="10" step="1" placeholder="10">
        </div>
        <div class="st-chatu8-field">
            <label for="comfyui_timeout">请求超时时间 (秒，1800秒为30分钟)</label>
            <input type="number" id="comfyui_timeout" class="st-chatu8-text-input" min="30" step="10" placeholder="1800">
        </div>
    </section>
    <div class="st-chatu8-settings-section">
        <h4>其他设置</h4>
        <div class="st-chatu8-field">
            <label for="MODEL_NAME">模型文件</label>
            <select id="MODEL_NAME" class="st-chatu8-select"></select>
        </div>
        <div class="st-chatu8-field">
            <label for="comfyuisamplerName">采样方法</label>
            <select id="comfyuisamplerName" class="st-chatu8-select"></select>
        </div>
        <div class="st-chatu8-field">
            <label for="comfyui_vae">VAE</label>
            <select id="comfyui_vae" class="st-chatu8-select"></select>
        </div>
        <div class="st-chatu8-field">
            <label for="comfyui_scheduler">调度器 (Scheduler)</label>
            <select id="comfyui_scheduler" class="st-chatu8-select"></select>
        </div>
        <div class="st-chatu8-field">
            <label for="comfyuiCLIPName">CLIP</label>
            <select id="comfyuiCLIPName" class="st-chatu8-select"></select>
        </div>
        <div class="st-chatu8-field">
            <label for="comfyui_clip_skip">CLIP skip / 停止在 CLIP 层</label>
            <input id="comfyui_clip_skip" type="number" min="-24" max="-1" step="1" class="st-chatu8-text-input" placeholder="留空沿用工作流，例如 -2">
        </div>
        <small>填写 -2 对应 ComfyUI 的 stop_at_clip_layer = -2。留空保持工作流原值；仅用于包含 CLIPSetLastLayer 节点的工作流。</small>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>生成参数</h4>
        <div class="st-chatu8-grid">
            <div class="st-chatu8-field">
                <label for="comfyui_size">预设尺寸</label>
                <select id="comfyui_size" class="st-chatu8-select">
                    <option value="512x512">512x512 (1:1, 图标)</option>
                    <option value="640x640">640x640 (1:1, 图标)</option>
                    <option value="512x768">512x768 (2:3, 垂直)</option>
                    <option value="768x512">768x512 (3:2, 水平)</option>
                    <option value="1024x1024">1024x1024 (1:1, SDXL)</option>
                    <option value="1216x832">1216x832 (19:13, 超高清)</option>
                    <option value="832x1216">832x1216 (13:19, 超高清)</option>
                </select>
            </div>
            <div class="st-chatu8-field">
                <label for="comfyui_width">宽度 (width)</label>
                <input type="number" id="comfyui_width" class="st-chatu8-text-input">
            </div>
            <div class="st-chatu8-field">
                <label for="comfyui_height">高度 (height)</label>
                <input type="number" id="comfyui_height" class="st-chatu8-text-input">
            </div>
            <div class="st-chatu8-field">
                <label for="comfyui_steps">生成步数 (steps)</label>
                <input type="number" id="comfyui_steps" class="st-chatu8-text-input">
            </div>
            <div class="st-chatu8-field">
                <label for="comfyui_seed">种子 (seed)</label>
                <input type="number" id="comfyui_seed" class="st-chatu8-text-input">
            </div>
            <div class="st-chatu8-field">
                <label for="cfg_comfyui">CFG</label>
                <input type="number" id="cfg_comfyui" class="st-chatu8-text-input">
            </div>
        </div>
    </div>

    <div class="st-chatu8-settings-section">
        <h3>配置档案</h3>
        <div class="st-chatu8-field">
            <label for="comfyui_profile_id">当前配置</label>
            <div class="st-chatu8-profile-controls">
                <select id="comfyui_profile_id" class="st-chatu8-select"></select>
                <button class="st-chatu8-icon-btn" id="comfyui_profile_load" title="读取">
                    <i class="fa-solid fa-folder-open"></i>
                </button>
                <button class="st-chatu8-icon-btn" id="comfyui_profile_new" title="新建">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button class="st-chatu8-icon-btn" id="comfyui_profile_save" title="保存当前">
                    <i class="fa-solid fa-save"></i>
                </button>
                <button class="st-chatu8-icon-btn danger" id="comfyui_profile_delete" title="删除">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>工作流</h3>
        <div class="st-chatu8-field">
            <label for="workerid">工作流预设</label>
            <div class="st-chatu8-profile-controls">
                <select id="workerid" class="st-chatu8-select"></select>
                <div class="st-chatu8-preset-box-wrapper">
                    <button type="button" class="st-chatu8-icon-btn st-chatu8-preset-box-btn" title="预设操作收纳盒">
                        <i class="fa-solid fa-table-cells"></i>
                    </button>
                    <div class="st-chatu8-preset-box-dropdown">
                        <div class="st-chatu8-preset-box-header">
                            <span class="st-chatu8-preset-box-title"><i class="fa-solid fa-box-archive"></i> 工作流操作</span>
                            <button type="button" class="st-chatu8-preset-box-close" title="关闭">&times;</button>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">预设管理</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item" id="worker_new" title="新建预设"><i class="fa-solid fa-plus"></i><span>新建</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="worker_update_style" title="保存修改"><i class="fa-solid fa-save"></i><span>保存</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="worker_save_style" title="另存为新预设"><i class="fa-solid fa-file-export"></i><span>另存为</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="worker_rename" title="重命名预设"><i class="fa-solid fa-pen"></i><span>重命名</span></button>
                            </div>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">导入与导出</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item" id="worker_export_current" title="导出当前预设"><i class="fa-solid fa-upload"></i><span>导出当前</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="worker_export_all" title="导出全部预设"><i class="fa-solid fa-file-export"></i><span>导出全部</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="worker_import" title="导入预设文件"><i class="fa-solid fa-download"></i><span>导入</span></button>
                            </div>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">危险操作</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item danger" id="worker_delete_style" title="删除预设"><i class="fa-solid fa-trash"></i><span>删除预设</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="worker">工作流 (JSON)</label>
            <textarea id="worker" class="st-chatu8-textarea" rows="5"></textarea>
            <div style="display: flex; gap: 10px; align-self: flex-end; margin-top: 10px;">
                <button id="eidtwork" class="st-chatu8-btn">简易修改</button>
                <button id="visualize_workflow" class="st-chatu8-btn"><i class="fa-solid fa-diagram-project"></i> 可视化</button>
            </div>
        </div>
    </div>
</div>
